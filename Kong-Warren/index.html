<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div class="inputs">
        <h1 class="result">result here</h1>
        <select id="operation-menu">
          <option value="plus">+</option>
          <option value="min">-</option>
          <option value="dev">/</option>
          <option value="multi">*</option>
          <option value="expo">^</option>
          <option value="root">√</option>
        </select>
        <input type="number" class="num1" placeholder="number one" />
        <input type="number" class="num2" placeholder="number two" />
      </div>
      <div class="submitBtn">
        <button id="button">caclulate</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
