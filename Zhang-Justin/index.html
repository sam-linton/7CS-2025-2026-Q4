<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Roulette Pro</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .roulette-box {
            position: relative;
            width: 400px;
            height: 400px;
            user-select: none;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ffcc00; /* Gold */
            z-index: 10;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 10px solid #333;
            position: relative;
            overflow: hidden;
            background: conic-gradient(
                #111 0deg 36deg, 
                #e74c3c 36deg 72deg, 
                #111 72deg 108deg, 
                #e74c3c 108deg 144deg,
                #111 144deg 180deg,
                #e74c3c 180deg 216deg,
                #111 216deg 252deg,
                #e74c3c 252deg 288deg,
                #111 288deg 324deg,
                #e74c3c 324deg 360deg
            );
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .labels {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .labels span {
            position: absolute;
            top: 0;
            left: 50%;
            width: 40px;
            height: 50%; 
            margin-left: -20px;
            transform-origin: bottom center; 
            
            display: flex;
            justify-content: center;
            align-items: center; 
            padding-top: 20px;
            box-sizing: border-box;

            font-weight: bold;
            font-size: 28px;
            color: white;
            transform: rotate(calc(36deg * var(--i) + 18deg));
        }

        #spinBtn {
            margin-top: 50px;
            padding: 15px 60px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            background: #ffcc00;
            color: #111;
            border: none;
            border-radius: 50px;
            transition: 0.2s;
            box-shadow: 0 6px #997a00;
            text-transform: uppercase;
        }

        #spinBtn:active {
            box-shadow: none;
            transform: translateY(4px);
        }

        #spinBtn:disabled {
            background: #555;
            box-shadow: none;
            color: #888;
            cursor: not-allowed;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .congrats-content {
            background: #fff;
            color: #111;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255,204,0,0.4);
            animation: bounceIn 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.49);
        }

        #winnerResult {
            font-size: 120px;
            font-weight: 900;
            color: #e74c3c;
            margin: 10px 0;
        }

        .close-btn {
            background: #111;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        @keyframes bounceIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="roulette-box">
        <div class="pointer"></div>
        <div id="wheel">
            <div class="labels">
                <span style="--i:0;">💩</span>
                <span style="--i:1;">💩</span>
                <span style="--i:2;">💰</span>
                <span style="--i:3;">💩</span>
                <span style="--i:4;">💩</span>
                <span style="--i:5;">💩</span>
                <span style="--i:6;">💩</span>
                <span style="--i:7;">💩</span>
                <span style="--i:8;">💩</span>
                <span style="--i:9;">💩</span>
            </div>
        </div>
    </div>

    <button id="spinBtn">Spin to Win</button>

    <div id="congratsScreen" class="overlay">
        <div class="congrats-content">
            <h2 style="margin:0;">🎉 CONGRATULATIONS! 🎉</h2>
            <p style="font-size: 18px;">The wheel landed on:</p>
            <div id="winnerResult">?</div>
            <button class="close-btn" onclick="closeCongrats()">Play Again</button>
        </div>
    </div>

    <script>
        const wheel = document.getElementById('wheel');
        const btn = document.getElementById('spinBtn');
        const resultText = document.getElementById('winnerResult');
        const overlay = document.getElementById('congratsScreen');
        
        let currentRotation = 0;
        const letters = ["JACKPOT!", "TRASH!", "TRASH!", "TRASH!", "TRASH!", "TRASH!", "TRA!", "TRASH!", "TRASH!", "TRASH!"];!

        btn.addEventListener('click', () => {
            // Lock button
            btn.disabled = true;

            // Calculate rotation (min 5 full turns + random)
            const randomDegrees = Math.floor(Math.random() * 360);
            const totalSpin = 1800 + randomDegrees; 
            currentRotation += totalSpin;

            // Apply spin
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Wait for animation to finish (4 seconds)
            setTimeout(() => {
                // Determine the winner
                // 1. Get the net rotation (0-359)
                const netRotation = currentRotation % 360;
                const winningIndex = Math.floor(((360 - netRotation + 270) % 360) / 36);

                resultText.innerText = letters[winningIndex];
                overlay.style.display = 'flex';
                
                btn.disabled = false;
            }, 4000);
        });

        function closeCongrats() {
            overlay.style.display = 'none';
        }
    </script>
</body>
</html>
