<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Bob</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            color: #111827;
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
            padding: 28px;
        }

        h1,
        h2 {
            margin: 0 0 16px;
        }

        .variables {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .variable {
            background: #f8fafc;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 14px;
        }

        .variable strong {
            display: inline-block;
            width: 120px;
        }

        pre {
            background: #0f172a;
            color: #f8fafc;
            padding: 18px;
            border-radius: 14px;
            overflow-x: auto;
        }

        .footer {
            margin-top: 18px;
            font-size: 0.95rem;
            color: #475569;
        }

        .reveal-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 16px;
        }

        .reveal-btn:hover {
            background: #2563eb;
        }

        .variables.hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>About Bob</h1>
            <p>This page recreates the values from <code>about_bob.java</code> and shows them as HTML variables.</p>

            <button class="reveal-btn" onclick="toggleInfo()">Info</button>

            <div class="variables hidden">
                <div class="variable"><strong>Name:</strong> <span id="bob-name"></span></div>
                <div class="variable"><strong>Age:</strong> <span id="bob-age"></span></div>
                <div class="variable"><strong>Height:</strong> <span id="bob-height"></span></div>
                <div class="variable"><strong>Likes pizza?</strong> <span id="bob-likes-pizza"></span></div>


            </div>

            <script>
                function toggleInfo() {
                    const variablesDiv = document.querySelector('.variables');
                    const button = document.querySelector('.reveal-btn');
                    variablesDiv.classList.toggle('hidden');
                    button.textContent = variablesDiv.classList.contains('hidden') ? 'Info' : 'Info';
                }

                const bob = {
                    name: 'Bob',
                    age: 101200,
                    height: 10.5,
                    likesPizza: false,
                };

                document.getElementById('bob-name').textContent = bob.name;
                document.getElementById('bob-age').textContent = bob.age;
                document.getElementById('bob-height').textContent = bob.height;
                document.getElementById('bob-likes-pizza').textContent = bob.likesPizza;
            </script>
</body>

</html>
