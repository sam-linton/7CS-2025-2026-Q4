<html lang="en">
<head>
   <title>clock</title>
   <link rel="stylesheet" href="style.css">
   <script src="script.js" defer></script>
</head>
<body>
<div class="gallery1">
   <h1>Pacific Standard Time</h1>
 
   <div class="gallery2">
       <input type="text" id="pst">
       <button onclick="enterTime('pst')">Enter</button>
      
       <h1 id="pst-input"></h1>
   </div>


   <h1>Eastern Standard Time</h1>
   <div>
       <input type="text" id="est">
       <button onclick="enterTime('est')">Enter</button>
       <h1 id="est-input"></h1>
   </div>


   <h1>Greenwich Mean Time</h1>
   <div>
       <input type="text" id="gmt">
       <button onclick="enterTime('gmt')">Enter</button>
       <h1 id="gmt-input"></h1>
   </div>


   <h1>Central European Time</h1>
   <div>
       <input type="text" id="cet">
       <button onclick="enterTime('cet')">Enter</button>
       <h1 id="cet-input"></h1>
   </div>


   <h1>Beijing Standard Time</h1>
   <div>
       <input type="text" id="bst">
       <button onclick="enterTime('bst')">Enter</button>
       <h1 id="bst-input"></h1>
   </div>


   <h1>Japanese Standard Time</h1>
   <div>
       <input type="text" id="jst">
       <button onclick="enterTime('jst')">Enter</button>
       <h1 id="jst-input"></h1>
   </div>
</div>
   <img src="map.png" alt="map">
   <div class="title">Time Zones</div>
</body>
</html>
