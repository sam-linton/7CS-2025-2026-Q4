<!DOCTYPE html>
<html>
<head>
  <title>Pet Store</title>
  <style>
    body {
      background-color: lightblue;
      font-family: Arial;
      text-align: center;
    }

    h1 {
      color: darkblue;
      font-size: 40px;
      margin-top: 20px;
    }

    p {
      font-size: 18px;
      color: #333;
    }

    .navbar {
      background-color: orange;
      padding: 10px;
    }

    .navbar a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 30px;
      gap: 20px;
    }

    .card {
      background-color: white;
      border: 2px solid orange;

      padding: 20px;
      width: 200px;
    }

    .card h3 {
      color: darkblue;
    }

    .card p {
      font-size: 14px;
    }

    .card button {
      background-color: orange;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }

    footer {
      background-color: orange;
      color: white;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="#">Home</a>
    <a href="#">Dogs</a>
    <a href="#">Cats</a>
    <a href="#">Contact</a>
  </div>

  <h1>🐾 Welcome to the Pet Store! 🐾</h1>
  <p>We sell stuff for your pets!!</p>

  <div class="products">

    <div class="card">
      <h2>🦴</h2>
      <h3>Dog Bone</h3>
      <p>Good for dogs</p>
      <p><b>$5.99</b></p>
      <button>Buy</button>
    </div>

    <div class="card">
      <h2>🐟</h2>
      <h3>Cat Food</h3>
      <p>Cats love this</p>
      <p><b>$7.99</b></p>
      <button>Buy</button>
    </div>

    <div class="card">
      <h2>🎾</h2>
      <h3>Tennis Ball</h3>
      <p>For fetch!!</p>
      <p><b>$3.99</b></p>
      <button>Buy</button>
    </div>

    <div class="card">
      <h2>🛏️</h2>
      <h3>Pet Bed</h3>
      <p>Very comfy</p>
      <p><b>$19.99</b></p>
      <button>Buy</button>
    </div>

    <div class="card">
      <h2>🐹</h2>
      <h3>Hamster Wheel</h3>
      <p>Spins around</p>
      <p><b>$9.99</b></p>
      <button>Buy</button>
    </div>

  </div>



</body>
</html>
