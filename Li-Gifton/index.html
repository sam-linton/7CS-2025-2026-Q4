<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airplane Image Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }

        /* scroll snapping track */
        .book-track {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            /* perspective makes like 3D */
            perspective: 2000px; 
        }

        /* viewport section as scroll anchor */
        .book-section {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* book frame */
        .book-page {
            width: 95%;
            max-width: 900px;
            height: 80vh;
            background: #fdfbf7; /* colour */
            border-radius: 8px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            
            /* rotation axis across the horizontal middle */
            transform-origin: center center;
            
            /* smooooth page transition */
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease;
            backface-visibility: hidden;
        }

        /* THE VERTICAL BOOK FLIP STATES */
        
        /* 1. incoming page coming from the bottom */
        .book-section .book-page {
            transform: rotateX(-90deg) translateY(100px);
            opacity: 0;
        }

        /* 2. active page */
        .book-section.active .book-page {
            transform: rotateX(0deg) translateY(0);
            opacity: 1;
        }

        /* 3. past page flip up */
        .book-section.past .book-page {
            transform: rotateX(90deg) translateY(-100px);
            opacity: 0;
        }

        /* stuff in page */
        .image-container {
            flex: 1;
            padding: 20px 20px 10px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border: 1px solid #e2ded2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .page-details {
            padding: 20px 30px 30px 30px;
            background: #fdfbf7;
            text-align: center;
            color: #2c2c2c;
            border-top: 1px dashed #e2ded2; /* notebook */
        }

        .page-details h2 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .page-details p {
            font-size: 1rem;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="book-track">

        <section class="book-section">
            <div class="book-page">
                <div class="image-container">
                    <img src="IMG_0255.JPG" alt="British Airways">
                </div>
                <div class="page-details">
                    <h2>A350</h2>
                    <p>lorem</p>
                </div>
            </div>
        </section>

        <section class="book-section">
            <div class="book-page">
                <div class="image-container">
                    <img src="IMG_0220.JPG" alt="Aviation">
                </div>
                <div class="page-details">
                    <h2>737</h2>
                    <p>lorem</p>
                </div>
            </div>
        </section>

        <section class="book-section">
            <div class="book-page">
                <div class="image-container">
                    <img src="IMG_0295.JPG" alt="Lufthansa">
                </div>
                <div class="page-details">
                    <h2>Lorem</h2>
                    <p>lorem</p>
                </div>
            </div>
        </section>

    </div>

    <script>
        const bookSections = document.querySelectorAll('.book-section');

        const observerOptions = {
            root: document.querySelector('.book-track'),
            rootMargin: '0px',
            threshold: 0.5 // triggers when the page crosses the halfway mark
        };

        const bookObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // current active page
                    entry.target.classList.add('active');
                    entry.target.classList.remove('past');
                } else {
                    entry.target.classList.remove('active');
                    
                    // if the page went off top of the screen give 'past' class flipped up
                    if (entry.boundingClientRect.top < 0) {
                        entry.target.classList.add('past');
                    } else {
                        entry.target.classList.remove('past');
                    }
                }
            });
        }, observerOptions);

        bookSections.forEach(section => {
            bookObserver.observe(section);
        });
    </script>

</body>
</html>
